services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dahorta}
      MYSQL_USER: ${DB_USERNAME:-dahorta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dahorta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dahorta-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
