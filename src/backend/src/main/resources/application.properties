spring.application.name=dahorta-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dahorta?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:dahorta}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
dahorta.pedidos.taxa-entrega=${DELIVERY_FEE:15.00}
dahorta.jwt.secret=${JWT_SECRET:}
dahorta.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
dahorta.admin.email=${ADMIN_EMAIL:}
dahorta.admin.password=${ADMIN_PASSWORD:}
dahorta.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
